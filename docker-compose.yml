services:
  postgres:
    image: postgres:16-alpine
    container_name: fixflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixflow}
      POSTGRES_USER: ${POSTGRES_USER:-fixflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixflow} -d ${POSTGRES_DB:-fixflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/FixFlow.Api/Dockerfile
    container_name: fixflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fixflow};Username=${POSTGRES_USER:-fixflow};Password=${POSTGRES_PASSWORD:-fixflow}
      Jwt__Issuer: ${JWT_ISSUER:-FixFlow}
      Jwt__Audience: ${JWT_AUDIENCE:-FixFlowClients}
      Jwt__Secret: ${JWT_SECRET:-replace-with-a-long-random-secret}
    ports:
      - "5080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: fixflow-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5080}
    ports:
      - "5173:80"

volumes:
  postgres_data:
